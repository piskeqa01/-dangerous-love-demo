<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>互動 Reels Demo</title>
  <style>
    :root {
      --bg: #08090d;
      --text: #f7f3ea;
      --muted: rgba(247, 243, 234, 0.64);
      --line: rgba(255, 255, 255, 0.14);
      --gold: #f5d277;
      --gain: #f8d57a;
      --soft: #cfe6ff;
      --extra: #ffefff;
      --down: #d9a2ae;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background: radial-gradient(circle at 50% 0%, #27212d 0, #111118 32%, var(--bg) 72%);
      overflow: hidden;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .home {
      width: min(980px, 100%);
      display: grid;
      gap: 22px;
    }

    .home h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 46px);
      letter-spacing: 0;
      line-height: 1.08;
    }

    .home p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .version-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .version-card {
      min-height: 160px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      text-align: left;
      display: grid;
      align-content: space-between;
      gap: 18px;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .version-card:hover {
      transform: translateY(-2px);
      border-color: rgba(245, 210, 119, 0.55);
      background: rgba(255, 255, 255, 0.1);
    }

    .version-card strong {
      display: block;
      font-size: 18px;
      line-height: 1.35;
    }

    .version-card span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .player-shell {
      width: min(440px, calc(100vw - 28px));
      display: grid;
      gap: 10px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .topbar button {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
    }

    .phone {
      position: relative;
      aspect-ratio: 9 / 16;
      width: 100%;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #15151d;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
    }

    .scene-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,0) 38%, rgba(0,0,0,0.74) 100%),
        var(--scene-gradient, linear-gradient(145deg, #27272f, #0b0c10));
    }

    .scene-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 28%, rgba(255,255,255,0.08), transparent 35%),
        radial-gradient(circle at 50% 102%, rgba(0,0,0,0.74), transparent 48%);
      pointer-events: none;
    }

    .scene-bg::before,
    .scene-bg::after {
      content: "";
      position: absolute;
      inset: auto;
      pointer-events: none;
      filter: blur(0.2px);
    }

    .scene-bg::before {
      width: 52%;
      height: 34%;
      left: 10%;
      top: 18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 64%);
    }

    .scene-bg::after {
      width: 1px;
      height: 58%;
      right: 24%;
      top: 18%;
      background: linear-gradient(180deg, transparent, rgba(255,255,255,0.28), transparent);
      box-shadow: -90px 18px 0 rgba(255,255,255,0.08), 68px -18px 0 rgba(255,255,255,0.06);
      opacity: 0.8;
    }

    .scene-meta {
      position: absolute;
      top: 18px;
      left: 18px;
      right: 18px;
      display: flex;
      justify-content: space-between;
      color: rgba(255, 255, 255, 0.58);
      font-size: 12px;
      letter-spacing: 0.02em;
    }

    .scene-visual-note {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 22%;
      min-height: 42%;
      display: grid;
      align-content: end;
      gap: 12px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.62;
      font-size: 13px;
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(0,0,0,0.22));
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 48px rgba(0,0,0,0.24);
      overflow: hidden;
    }

    .scene-visual-note::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0, rgba(255,255,255,0.05) 48%, transparent 100%),
        radial-gradient(circle at 20% 18%, rgba(245, 210, 119, 0.16), transparent 34%);
      pointer-events: none;
    }

    .stage-label,
    .visual-copy,
    .character-strip {
      position: relative;
      z-index: 1;
    }

    .stage-label {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .visual-copy {
      margin: 0;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.82);
    }

    .character-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .character-chip {
      border-radius: 999px;
      padding: 6px 9px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.76);
      font-size: 12px;
    }

    .character-chip.primary-role {
      color: #17110a;
      background: linear-gradient(135deg, rgba(245,210,119,0.92), rgba(255,241,189,0.88));
    }

    .subtitle {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 30px;
      display: grid;
      gap: 8px;
      padding: 14px 16px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(16px);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .subtitle.hidden {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    .speaker {
      color: var(--gold);
      font-size: 13px;
      font-weight: 700;
    }

    .line {
      font-size: 19px;
      line-height: 1.45;
      font-weight: 650;
    }

    .tap-layer {
      position: absolute;
      inset: 0;
      border: 0;
      background: transparent;
      color: transparent;
    }

    .prediction-layer {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 18px;
      height: 38%;
      display: none;
      align-items: stretch;
      z-index: 5;
    }

    .prediction-layer.show { display: flex; }

    .bubble {
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(12, 13, 18, 0.72);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(22px);
      padding: 13px;
      display: grid;
      gap: 10px;
      overflow: hidden;
    }

    .bubble.ff {
      background: rgba(242, 244, 247, 0.18);
      border-color: rgba(255, 255, 255, 0.28);
    }

    .balance-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: rgba(255, 255, 255, 0.74);
      font-size: 12px;
    }

    .question {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 760;
    }

    .options {
      display: grid;
      gap: 7px;
    }

    .option {
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      padding: 9px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      min-height: 36px;
    }

    .option.selected {
      border-color: rgba(245, 210, 119, 0.76);
      background: rgba(245, 210, 119, 0.16);
    }

    .odds {
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
      white-space: nowrap;
    }

    .bet-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 9px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.72);
    }

    .bet-row input { width: 100%; accent-color: var(--gold); }

    .primary {
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #f0d27c, #fff1bd);
      color: #17110a;
      font-weight: 800;
      padding: 10px 12px;
    }

    .primary:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .result-card {
      gap: 8px;
      justify-content: center;
    }

    .event-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 860;
    }

    .event-copy {
      margin: 0;
      color: rgba(255, 255, 255, 0.78);
      font-size: 14px;
      line-height: 1.45;
    }

    .event-bonus {
      border-color: rgba(255, 232, 153, 0.55);
      box-shadow: 0 20px 70px rgba(245, 210, 119, 0.20), 0 0 0 1px rgba(245, 210, 119, 0.12) inset;
    }

    .event-tie-win {
      border-color: rgba(255, 239, 255, 0.62);
      box-shadow: 0 22px 80px rgba(255, 210, 251, 0.18), 0 0 0 1px rgba(255, 255, 255, 0.12) inset;
    }

    .event-tie-near {
      border-color: rgba(207, 230, 255, 0.48);
      box-shadow: 0 18px 66px rgba(120, 174, 235, 0.13);
    }

    .settlement {
      display: grid;
      gap: 7px;
      margin-top: 2px;
    }

    .settle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 13px;
    }

    .settle-row .amount {
      font-weight: 850;
      font-size: 15px;
    }

    .gain .amount { color: var(--gain); text-shadow: 0 0 16px rgba(245, 210, 119, 0.35); }
    .refund .amount { color: var(--soft); }
    .down .amount { color: var(--down); }
    .extra {
      border: 1px solid rgba(255, 239, 255, 0.34);
      background: linear-gradient(135deg, rgba(255, 239, 255, 0.18), rgba(245, 210, 119, 0.10));
    }
    .extra .amount { color: var(--extra); text-shadow: 0 0 18px rgba(255, 239, 255, 0.42); }

    .controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .ghost {
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.08);
      padding: 9px 14px;
    }

    .hidden-screen { display: none; }

    @media (max-width: 760px) {
      body { overflow: auto; }
      .app { align-items: start; }
      .version-grid { grid-template-columns: 1fr 1fr; }
      .version-card { min-height: 132px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="home" id="home">
      <div>
        <h1>互動 Reels Demo</h1>
        <p>選擇版本後開始體驗。每句字幕對應一張直式單幕；目前使用佔位畫面，不產圖。</p>
      </div>
      <div class="version-grid" id="versionGrid"></div>
    </section>

    <section class="player-shell hidden-screen" id="player">
      <div class="topbar">
        <button type="button" id="backBtn">返回首頁</button>
        <span id="routeLabel"></span>
        <span id="sceneCounter"></span>
      </div>
      <div class="phone" id="phone">
        <div class="scene-bg" id="sceneBg"></div>
        <div class="scene-vignette"></div>
        <div class="scene-meta">
          <span id="sceneId"></span>
          <span id="bgmLabel"></span>
        </div>
        <div class="scene-visual-note" id="visualNote"></div>
        <button class="tap-layer" type="button" id="tapLayer">下一幕</button>
        <div class="subtitle" id="subtitle">
          <div class="speaker" id="speaker"></div>
          <div class="line" id="line"></div>
        </div>
        <div class="prediction-layer" id="predictionLayer"></div>
      </div>
      <div class="controls">
        <button class="ghost" type="button" id="prevBtn">上一幕</button>
        <button class="ghost" type="button" id="nextBtn">下一幕</button>
      </div>
    </section>
  </main>

  <audio id="bgm" loop preload="auto"></audio>

  <script>

    const versions = {

          ["BMF-02", "崔元欷", "逃賽的人，通常也這麼說。", "崔元欷站在車燈前，黑襯衫，冷白膚色，壓迫感。"],

          ],

        }
      },
      DFF: {
        title: "危險關係｜女女戀",
        vibe: "溫柔陷阱、情緒試探、親密邊界",
        bgm: "upload/危險版2.mp3",
        bgmName: "危險版2",
        uiTone: "ff",
        gradient: "linear-gradient(145deg, #121018 0%, #2f2b35 44%, #11141a 100%)",
        scenes: [
          ["DFF-01", "尹夏恩", "我以為你不會來。", "深夜餐廳窗邊，夏恩穿奶油白針織，眼神柔亮。"],
          ["DFF-02", "姜元熙", "你故意把時間發給我，不就是想讓我來嗎？", "姜元熙坐下，黑長髮，冷靜卻溫柔。"],
          ["DFF-03", "尹夏恩", "元熙，你每次都把我想得太壞。", "夏恩笑得輕，像撒嬌也像試探。"],
          ["DFF-04", "姜元熙", "不是壞。是你太會把求救說成玩笑。", "姜元熙看穿她，語氣低而克制。"],
          ["DFF-05", "尹夏恩", "那你現在是在救我，還是在審我？", "夏恩手指碰到杯沿，情緒游移。"],
          ["DFF-06", "姜元熙", "看你希望我用哪一種身份留下。", "姜元熙抬眼，曖昧但不壓迫。"],
          ["DFF-07", "尹夏恩", "如果我說，我今晚不想回去呢？", "夏恩聲音放低，主動靠近。"],
          ["DFF-08", "姜元熙", "那就別再假裝自己只是路過。", "姜元熙沒有伸手，卻把退路留得很近。"],
          ["DFF-09", "尹夏恩", "你這樣比逼我還過分。", "夏恩笑意淡了，心動感浮出來。"],
          ["DFF-10", "姜元熙", "我沒有逼你，夏恩。是你自己停下來的。", "姜元熙望著她，畫面收在安靜的危險曖昧。"]
        ],
        prediction: {
          after: "DFF-06",
          type: "yesNo",
          mode: "normal",
          question: "夏恩接下來會怎麼選？",
          options: [
            { id: "A", label: "留下", odds: 1.90, result: "win" },
            { id: "B", label: "離開", odds: 2.00, result: "miss" }
          ],
          correct: "A"
        }
      }
    };

    let currentKey = null;
    let currentIndex = 0;
    let balance = START_BALANCE;
    let selectedOption = null;
    let bet = 100;
    let revealedPredictions = new Set();

    const home = document.getElementById("home");
    const player = document.getElementById("player");
    const versionGrid = document.getElementById("versionGrid");
    const sceneBg = document.getElementById("sceneBg");
    const sceneId = document.getElementById("sceneId");
    const bgmLabel = document.getElementById("bgmLabel");
    const visualNote = document.getElementById("visualNote");
    const subtitle = document.getElementById("subtitle");
    const speaker = document.getElementById("speaker");
    const line = document.getElementById("line");
    const predictionLayer = document.getElementById("predictionLayer");
    const routeLabel = document.getElementById("routeLabel");
    const sceneCounter = document.getElementById("sceneCounter");
    const bgm = document.getElementById("bgm");

    function formatMoney(value) {
      return Number(value).toLocaleString("zh-Hant");
    }

    function sceneObj(raw) {
      return { id: raw[0], speaker: raw[1], text: raw[2], visual: raw[3] };
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function sceneCharacters(versionKey) {
      if (versionKey === "BMF" || versionKey === "DMF") return ["尹夏恩", "崔元欷"];
      return ["尹夏恩", "姜元熙"];
    }

    function sceneStageLabel(versionKey, sceneIdValue) {
      const family = versionKey.startsWith("B") ? "懸賞線" : "危險關係";
      const pairing = versionKey.endsWith("MF") ? "男女戀" : "女女戀";
      return `${family} · ${pairing} · ${sceneIdValue}`;
    }

    function renderVisualCard(versionKey, scene) {
      const chips = sceneCharacters(versionKey).map(name => {
        const roleClass = name === scene.speaker ? "character-chip primary-role" : "character-chip";
        return `<span class="${roleClass}">${escapeHTML(name)}</span>`;
      }).join("");
      return `
        <span class="stage-label">${escapeHTML(sceneStageLabel(versionKey, scene.id))}</span>
        <p class="visual-copy">${escapeHTML(scene.visual)}</p>
        <div class="character-strip">${chips}</div>
      `;
    }

    Object.entries(versions).forEach(([key, version]) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "version-card";
      card.innerHTML = `<strong>${version.title}</strong><span>${version.vibe}<br>BGM：${version.bgmName}</span>`;
      card.addEventListener("click", () => startVersion(key));
      versionGrid.appendChild(card);
    });

    function startVersion(key) {
      currentKey = key;
      currentIndex = 0;
      balance = START_BALANCE;
      selectedOption = null;
      bet = 100;
      revealedPredictions = new Set();
      home.classList.add("hidden-screen");
      player.classList.remove("hidden-screen");
      bgm.src = versions[key].bgm;
      bgm.volume = 0.45;
      bgm.play().catch(() => {});
      renderScene();
    }

    function renderScene() {
      const version = versions[currentKey];
      const scene = sceneObj(version.scenes[currentIndex]);
      sceneBg.style.setProperty("--scene-gradient", version.gradient);
      sceneId.textContent = scene.id;
      bgmLabel.textContent = version.bgmName;
      visualNote.innerHTML = renderVisualCard(currentKey, scene);
      speaker.textContent = `${scene.speaker}：`;
      line.textContent = scene.text;
      routeLabel.textContent = version.title;
      sceneCounter.textContent = `${currentIndex + 1}/${version.scenes.length}`;
      subtitle.classList.remove("hidden");
      predictionLayer.classList.remove("show");
      predictionLayer.innerHTML = "";
    }

    function maybeShowPrediction() {
      const version = versions[currentKey];
      const scene = sceneObj(version.scenes[currentIndex]);
      const prediction = version.prediction;
      if (!prediction || prediction.after !== scene.id || revealedPredictions.has(scene.id)) return false;
      showPrediction(prediction, version);
      return true;
    }

    function showPrediction(prediction, version) {
      selectedOption = null;
      bet = 100;
      subtitle.classList.add("hidden");
      predictionLayer.innerHTML = `
        <div class="bubble ${version.uiTone === "ff" ? "ff" : ""}">
          <div class="balance-row">
            <span>帳戶餘額：${formatMoney(balance)}</span>
            <span>${prediction.type === "yesNo" ? "是非題" : "選擇題"}</span>
          </div>
          <p class="question">${prediction.question}</p>
          <div class="options">
            ${prediction.options.map(option => `
              <button type="button" class="option" data-option="${option.id}">
                <span>${option.label}</span>
                <span class="odds">${option.odds.toFixed(2)}x</span>
              </button>
            `).join("")}
          </div>
          <div class="bet-row">
            <span>投入 ${formatMoney(bet)}</span>
            <input id="betInput" type="range" min="50" max="300" step="50" value="${bet}">
            <span id="potential">可得 --</span>
          </div>
          <button class="primary" id="confirmBtn" type="button" disabled>確認預測</button>
        </div>
      `;
      predictionLayer.classList.add("show");
      predictionLayer.querySelectorAll(".option").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedOption = prediction.options.find(option => option.id === btn.dataset.option);
          predictionLayer.querySelectorAll(".option").forEach(item => item.classList.remove("selected"));
          btn.classList.add("selected");
          predictionLayer.querySelector("#confirmBtn").disabled = false;
          updatePotential();
        });
      });
      predictionLayer.querySelector("#betInput").addEventListener("input", event => {
        bet = Number(event.target.value);
        predictionLayer.querySelector(".bet-row span").textContent = `投入 ${formatMoney(bet)}`;
        updatePotential();
      });
      predictionLayer.querySelector("#confirmBtn").addEventListener("click", () => revealResult(prediction, version));
    }

    function updatePotential() {
      const potential = predictionLayer.querySelector("#potential");
      if (!selectedOption || !potential) return;
      potential.textContent = `可得 ${formatMoney(Math.round(bet * selectedOption.odds))}`;
    }

    function revealResult(prediction, version) {
      if (!selectedOption) return;
      const settlement = buildSettlement(prediction, selectedOption);
      balance = settlement.newBalance;
      revealedPredictions.add(sceneObj(version.scenes[currentIndex]).id);
      predictionLayer.innerHTML = `
        <div class="bubble result-card ${settlement.eventClass}">
          <h2 class="event-title">${settlement.title}</h2>
          <p class="event-copy">${settlement.copy}</p>
          <div class="settlement">
            ${settlement.parts.map(part => `
              <div class="settle-row ${part.kind}">
                <span>${part.label}</span>
                <span class="amount">${part.amount}</span>
              </div>
            `).join("")}
            <div class="settle-row">
              <span>目前餘額</span>
              <span class="amount">${formatMoney(balance)}</span>
            </div>
          </div>
          <button class="primary" id="continueBtn" type="button">繼續劇情</button>
        </div>
      `;
      predictionLayer.querySelector("#continueBtn").addEventListener("click", nextScene);
    }

    function buildSettlement(prediction, option) {
      const reserved = balance - bet;
      const payout = Math.round(bet * option.odds);
      const extra = Math.round(bet * 1.4);
      if (prediction.mode === "bonus") {
        return {
          newBalance: reserved + payout,
          eventClass: "event-bonus",
          title: "哇！太幸運了～",
          copy: "Bonus 來了！這題全部選項通通有獎，剛好被你遇到！",
          parts: [{ label: "獲得", amount: `+${formatMoney(payout)}`, kind: "gain" }]
        };
      }
      if (prediction.mode === "tie" && option.result === "near") {
        const refund = Math.round(bet * 0.5);
        return {
          newBalance: reserved + refund,
          eventClass: "event-tie-near",
          title: "這個有算到～",
          copy: "你選的不是最後那一下，但前面的反應確實被你抓住了。",
          parts: [{ label: "返還", amount: `+${formatMoney(refund)}`, kind: "refund" }]
        };
      }
      if (prediction.mode === "tie" && option.result === "tieWin") {
        return {
          newBalance: reserved + payout + extra,
          eventClass: "event-tie-win",
          title: "太會猜了吧！",
          copy: "你簡直像本人一樣懂她，連她下一步怎麼藏都看出來了。",
          parts: [
            { label: "獲得", amount: `+${formatMoney(payout)}`, kind: "gain" },
            { label: "額外獎勵", amount: `+${formatMoney(extra)}`, kind: "extra" }
          ]
        };
      }
      if (option.id === prediction.correct) {
        return {
          newBalance: reserved + payout,
          eventClass: "",
          title: "猜中了！",
          copy: "你真的有看懂她，下一步完全被你看到了。",
          parts: [{ label: "獲得", amount: `+${formatMoney(payout)}`, kind: "gain" }]
        };
      }
      return {
        newBalance: reserved,
        eventClass: "",
        title: "故事轉了一下～",
        copy: "她這次換了個節奏，下一幕會把答案演出來。",
        parts: [{ label: "本次調整", amount: `-${formatMoney(bet)}`, kind: "down" }]
      };
    }

    function nextScene() {
      if (maybeShowPrediction()) return;
      const version = versions[currentKey];
      if (currentIndex < version.scenes.length - 1) {
        currentIndex += 1;
        renderScene();
      }
    }

    function prevScene() {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderScene();
      }
    }

    document.getElementById("tapLayer").addEventListener("click", nextScene);
    document.getElementById("nextBtn").addEventListener("click", nextScene);
    document.getElementById("prevBtn").addEventListener("click", prevScene);
    document.getElementById("backBtn").addEventListener("click", () => {
      bgm.pause();
      player.classList.add("hidden-screen");
      home.classList.remove("hidden-screen");
    });
  </script>
</body>
</html>
